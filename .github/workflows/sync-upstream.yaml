name: Sync upstream

on:
  schedule:
    # 每天 UTC 18:00（北京时间次日 02:00）检查一次上游更新
    - cron: '0 18 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动触发
  push:
    branches: ['main']
    paths:
      # 修改同步逻辑时立即自测一次，也可用于手动触发一次同步
      - '.github/workflows/sync-upstream.yaml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/AIsouler/MyClash.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Merge upstream into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit

      - name: Preserve downstream network optimizations
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          FCM_DOMAINS = [
              'mtalk.google.com',
              'mtalk4.google.com',
              'mtalk-dev.google.com',
              'mtalk-staging.google.com',
              'alt1-mtalk.google.com',
              'alt2-mtalk.google.com',
              'alt3-mtalk.google.com',
              'alt4-mtalk.google.com',
              'alt5-mtalk.google.com',
              'alt6-mtalk.google.com',
              'alt7-mtalk.google.com',
              'alt8-mtalk.google.com',
              'android.apis.google.com',
              'device-provisioning.googleapis.com',
              'firebaseinstallations.googleapis.com',
          ]

          STATIC_FILES = [
              Path('Config/mihomoConfig.yaml'),
              Path('Config/mihomoConfigLite.yaml'),
          ]
          JS_FILES = [
              Path('Script/Script.js'),
              Path('Script/mihomoScript.js'),
          ]

          QUIC_RULE = "AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((OR,((RULE-SET,geolocation-cn),(RULE-SET,cn_additional),(RULE-SET,cn_ip,no-resolve)))))),REJECT"

          def patch_static(path):
              text = path.read_text(encoding='utf-8')

              # 1. FCM 相关域名保持 real-IP，避免 fake-ip 干扰长连接和注册流程。
              match = re.search(r"(?m)^  fake-ip-filter:\s*(\[[\s\S]*?\])", text)
              if not match:
                  raise RuntimeError(f'{path}: fake-ip-filter not found')

              block = match.group(1)
              entries = re.findall(r"'([^']+)'", block)
              for domain in FCM_DOMAINS:
                  if domain not in entries:
                      entries.append(domain)

              rebuilt = '[\n' + ''.join(f"      '{entry}',\n" for entry in entries) + '    ]'
              text = text[:match.start(1)] + rebuilt + text[match.end(1):]

              comment = '  # FCM 推送相关域名使用真实 DNS 结果，避免 fake-ip 干扰长连接与注册流程'
              if re.search(r'(?m)^  # FCM .*$', text):
                  text = re.sub(r'(?m)^  # FCM .*$', comment, text, count=1)
              else:
                  text = text.replace('  fake-ip-filter:', comment + '\n  fake-ip-filter:', 1)

              # 2. 国内域名统一使用直连国内 DoH，兼顾 CDN 调度与 DNS 隐私。
              policy_pattern = re.compile(
                  r"(?m)^(\s*)'rule-set:cn':\s*\*chinaDNS\s*$"
              )
              m = policy_pattern.search(text)
              if not m:
                  raise RuntimeError(f'{path}: nameserver-policy rule-set:cn not found')
              indent = m.group(1)
              replacement = (
                  f"{indent}'rule-set:cn': *chinaDohDNS\n"
                  f"{indent}'rule-set:geolocation-cn': *chinaDohDNS"
              )
              text = policy_pattern.sub(replacement, text, count=1)

              # 3. 国外 QUIC 禁用时，以 geolocation-cn + cn_additional + cn_ip 共同判定国内流量。
              text, count = re.subn(
                  r"AND,\(\(NETWORK,UDP\),\(DST-PORT,443\),\(NOT,\(\(OR,\(\(RULE-SET,cn_additional\),\(RULE-SET,cn_ip,no-resolve\)\)\)\)\)\),REJECT",
                  QUIC_RULE,
                  text,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError(f'{path}: QUIC rule not found')

              path.write_text(text, encoding='utf-8')

          def patch_js(path):
              text = path.read_text(encoding='utf-8')

              # 1. FCM real-IP 保护。
              match = re.search(r"(?m)^(\s*)'fake-ip-filter':\s*\[([\s\S]*?)\]", text)
              if not match:
                  raise RuntimeError(f'{path}: fake-ip-filter not found')

              indent = match.group(1)
              inner = match.group(2)
              entries = re.findall(r"'([^']+)'", inner)
              spreads = re.findall(r"\.\.\.[A-Za-z_$][\w$]*", inner)
              for domain in FCM_DOMAINS:
                  if domain not in entries:
                      entries.append(domain)

              item_indent = indent + '  '
              rebuilt = (
                  f"{indent}'fake-ip-filter': [\n"
                  + ''.join(f"{item_indent}'{entry}',\n" for entry in entries)
                  + ''.join(f"{item_indent}{spread},\n" for spread in spreads)
                  + f'{indent}]'
              )
              text = text[:match.start()] + rebuilt + text[match.end():]

              comment = indent + '// FCM 推送相关域名使用真实 DNS 结果，避免 fake-ip 干扰长连接与注册流程'
              old_comment = re.compile(r'(?m)^\s*// FCM .*$', re.M)
              block_start = text.rfind('\n', 0, text.find("'fake-ip-filter':")) + 1
              before = text[:block_start]
              if old_comment.search(before[-300:]):
                  start = max(0, len(before) - 300)
                  tail = before[start:]
                  tail = old_comment.sub(comment, tail, count=1)
                  text = before[:start] + tail + text[block_start:]
              else:
                  text = text[:block_start] + comment + '\n' + text[block_start:]

              # 2. 国内域名走直连国内 DoH。
              policy_pattern = re.compile(
                  r"(?m)^(\s*)'rule-set:cn':\s*chinaDNS,\s*$"
              )
              m = policy_pattern.search(text)
              if not m:
                  raise RuntimeError(f'{path}: nameserver-policy rule-set:cn not found')
              policy_indent = m.group(1)
              replacement = (
                  f"{policy_indent}'rule-set:cn': chinaDohDNS,\n"
                  f"{policy_indent}'rule-set:geolocation-cn': chinaDohDNS,"
              )
              text = policy_pattern.sub(replacement, text, count=1)

              # 3. 国内 QUIC 判定补充 geolocation-cn。
              old_quic = "AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((OR,((RULE-SET,cn_additional),(RULE-SET,cn_ip,no-resolve)))))),REJECT"
              if old_quic not in text:
                  raise RuntimeError(f'{path}: QUIC rule not found')
              text = text.replace(old_quic, QUIC_RULE, 1)

              path.write_text(text, encoding='utf-8')

          for file in STATIC_FILES:
              patch_static(file)
          for file in JS_FILES:
              patch_js(file)

          for path in STATIC_FILES + JS_FILES:
              text = path.read_text(encoding='utf-8')
              for domain in FCM_DOMAINS:
                  if domain not in text:
                      raise RuntimeError(f'{path}: missing protected FCM domain {domain}')
              if 'RULE-SET,geolocation-cn' not in text or QUIC_RULE not in text:
                  raise RuntimeError(f'{path}: missing protected China QUIC rule')
              if 'rule-set:geolocation-cn' not in text or 'chinaDohDNS' not in text:
                  raise RuntimeError(f'{path}: missing protected China DoH policy')

          print('Downstream FCM, China QUIC and China DoH optimizations verified for all four files')
          PY

      - name: Commit protected downstream changes
        run: |
          git add Config/mihomoConfig.yaml Config/mihomoConfigLite.yaml Script/Script.js Script/mihomoScript.js
          if git diff --cached --quiet; then
            echo "Downstream optimizations already intact"
          else
            git commit -m "perf: preserve FCM, China QUIC and DoH optimizations"
          fi

      - name: Push
        run: git push origin main
